<!doctype html>
<html lang="el">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>City4All AI</title>

  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f5f7fa;
    }

    body {
      min-height: 100dvh;
    }

    calcite-shell {
      width: 100%;
      height: 100%;
    }

    arcgis-map {
      width: 100%;
      height: 100%;
    }

    /* ==================================================
       AI PANEL
       ================================================== */

    #assistant-panel {
      --calcite-shell-panel-width: 440px;
      width: 440px;
      max-width: 45vw;
    }

    #assistant-panel calcite-panel {
      height: 100%;
    }

    arcgis-assistant {
      width: 100%;
      height: 100%;
    }

    /* ==================================================
       RESULTS PANEL
       ================================================== */

    #results-panel {
      position: absolute;
      top: 18px;
      left: 18px;

      width: 390px;
      max-width: calc(100vw - 36px);

      max-height: calc(100vh - 180px);

      z-index: 100;

      background: rgba(255, 255, 255, 0.97);

      border:
        1px solid
        rgba(0, 0, 0, 0.1);

      border-radius: 18px;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.18);

      backdrop-filter: blur(14px);

      overflow: hidden;

      display: none;
    }

    #results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px 16px;

      border-bottom:
        1px solid
        #e5e7eb;
    }

    #results-title {
      font-size: 15px;
      font-weight: 700;
    }

    #results-list {
      padding: 10px;
      overflow-y: auto;

      max-height: calc(100vh - 240px);
    }

    .result-card {
      background: #f8fafc;

      border:
        1px solid
        #e5e7eb;

      border-radius: 14px;

      padding: 13px;

      margin-bottom: 9px;
    }

    .result-card:last-child {
      margin-bottom: 0;
    }

    .result-name {
      font-weight: 700;
      font-size: 14px;
      color: #17202a;
    }

    .result-type {
      font-size: 11px;
      color: #667085;
      margin-top: 3px;
    }

    .result-accessibility {
      margin-top: 8px;

      font-size: 12px;

      line-height: 1.45;

      color: #344054;
    }

    .result-actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 7px;

      margin-top: 10px;
    }

    .result-button {
      border: 0;

      border-radius: 10px;

      padding: 9px;

      cursor: pointer;

      font-size: 12px;

      font-weight: 700;

      background: #1769aa;

      color: white;
    }

    .result-button.secondary {
      background: #eef2f6;
      color: #344054;
    }

    .result-button:hover {
      opacity: 0.9;
    }

    /* ==================================================
       ROUTING PANEL
       ================================================== */

    #routing-panel {
      position: absolute;

      left: 18px;
      bottom: 18px;

      width: 390px;

      max-width:
        calc(100vw - 36px);

      z-index: 110;

      background:
        rgba(255,255,255,.97);

      border:
        1px solid
        rgba(0,0,0,.1);

      border-radius: 18px;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.18);

      overflow: hidden;

      backdrop-filter:
        blur(12px);

      display: none;
    }

    #routing-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding: 14px 16px;

      border-bottom:
        1px solid
        #e5e7eb;
    }

    #routing-title {
      display: flex;

      align-items: center;

      gap: 9px;

      font-weight: 700;

      font-size: 15px;
    }

    #routing-subtitle {
      margin-top: 3px;

      color: #667085;

      font-size: 11px;
    }

    #route-content {
      padding: 14px 16px;
    }

    #selected-place {
      padding: 11px;

      border-radius: 12px;

      background: #f1f5f9;

      margin-bottom: 10px;

      font-size: 13px;

      line-height: 1.4;
    }

    #selected-place strong {
      display: block;
      margin-bottom: 3px;
    }

    .route-buttons {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;
    }

    .route-button {
      border: 0;

      border-radius: 11px;

      padding: 11px;

      cursor: pointer;

      font-size: 13px;

      font-weight: 600;

      background: #1769aa;

      color: white;
    }

    .route-button.secondary {
      background: #eef2f6;
      color: #344054;
    }

    .route-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #route-status {
      margin-top: 11px;

      font-size: 12px;

      color: #667085;

      line-height: 1.45;
    }

    #route-summary {
      display: none;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-top: 11px;
    }

    .summary-card {
      background: #f8fafc;

      border:
        1px solid
        #e5e7eb;

      border-radius: 12px;

      padding: 10px;
    }

    .summary-label {
      font-size: 10px;
      color: #667085;
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 16px;
      font-weight: 700;
      color: #17202a;
    }

    #directions {
      display: none;

      margin-top: 11px;

      max-height: 170px;

      overflow-y: auto;

      border-top:
        1px solid
        #e5e7eb;

      padding-top: 9px;
    }

    .direction-step {
      padding: 8px 0;

      border-bottom:
        1px solid
        #f0f2f5;

      font-size: 12px;

      line-height: 1.4;
    }

    /* ==================================================
       GOOGLE MAPS
       ================================================== */

    #google-maps-button {
      width: 100%;

      margin-top: 8px;

      background: #111827;
    }

    /* ==================================================
       MAP HELP
       ================================================== */

    #map-help {
      position: absolute;

      top: 18px;
      left: 50%;

      transform:
        translateX(-50%);

      z-index: 90;

      background:
        rgba(23,105,170,.96);

      color: white;

      padding:
        9px 14px;

      border-radius: 12px;

      font-size: 12px;

      box-shadow:
        0 6px 20px
        rgba(0,0,0,.15);

      pointer-events: none;

      opacity: 0;

      transition:
        opacity .25s;
    }

    #map-help.visible {
      opacity: 1;
    }

    /* ==================================================
       MOBILE
       ================================================== */

    @media (max-width: 900px) {

      html,
      body {
        overflow: auto;
      }

      calcite-shell {
        height: 100dvh;
      }

      arcgis-map {
        height: 56dvh;
        min-height: 390px;
      }

      #assistant-panel {
        width: 100%;
        max-width: 100%;
        height: 44dvh;
      }

      #results-panel {
        top: 10px;
        left: 10px;
        right: 10px;

        width: auto;
        max-width: none;

        max-height: 42dvh;
      }

      #results-list {
        max-height: 34dvh;
      }

      #routing-panel {
        left: 10px;
        right: 10px;
        bottom: 10px;

        width: auto;
        max-width: none;
      }

      #map-help {
        top: 10px;

        max-width:
          calc(100vw - 30px);

        text-align: center;
      }
    }

    @media (max-width: 600px) {

      arcgis-map {
        height: 52dvh;
        min-height: 360px;
      }

      #assistant-panel {
        height: 48dvh;
      }

      #routing-panel {
        bottom: 8px;
        left: 8px;
        right: 8px;

        border-radius: 16px;
      }

      #results-panel {
        top: 8px;
        left: 8px;
        right: 8px;
      }

      #route-content {
        padding: 11px 13px;
      }

      #directions {
        max-height: 120px;
      }
    }
  </style>
</head>


<body>

  <calcite-shell>

    <!-- ==================================================
         CITY4ALL MAP
         ================================================== -->

    <arcgis-map
      id="city4all-map"
      item-id="969e9e5433dd4b968cf06793dc7b7aca"
    >

      <arcgis-zoom
        slot="top-left">
      </arcgis-zoom>

      <arcgis-expand
        slot="top-left">

        <arcgis-legend>
        </arcgis-legend>

      </arcgis-expand>

    </arcgis-map>


    <!-- ==================================================
         AI ASSISTANT
         ================================================== -->

    <calcite-shell-panel
      slot="panel-end"
      id="assistant-panel"
      width="l"
    >

      <calcite-panel>

        <arcgis-assistant
          id="city4all-assistant"

          reference-element="#city4all-map"

          heading="City4All AI"

          description="Ρώτησέ με φυσικά για προσβάσιμα σημεία, υπηρεσίες και δυνατότητες προσβασιμότητας."

          entry-message="Γεια σου! 👋 Είμαι ο AI Assistant του City4All. Μπορώ να σε βοηθήσω να βρεις προσβάσιμα σημεία, να σου εξηγήσω χαρακτηριστικά προσβασιμότητας και να σε οδηγήσω στον προορισμό σου."

          log-enabled
          copy-enabled
        >

          <arcgis-assistant-navigation-agent>
          </arcgis-assistant-navigation-agent>

          <arcgis-assistant-data-exploration-agent>
          </arcgis-assistant-data-exploration-agent>

          <arcgis-assistant-help-agent>
          </arcgis-assistant-help-agent>

        </arcgis-assistant>

      </calcite-panel>

    </calcite-shell-panel>

  </calcite-shell>


  <!-- ==================================================
       AI RESULTS
       ================================================== -->

  <div id="results-panel">

    <div id="results-header">

      <div id="results-title">
        📍 Αποτελέσματα City4All
      </div>

      <button
        id="close-results"
        class="route-button secondary"
        style="
          width:34px;
          height:34px;
          padding:0;
        "
      >
        ×
      </button>

    </div>

    <div id="results-list"></div>

  </div>


  <!-- ==================================================
       ROUTING
       ================================================== -->

  <div id="routing-panel">

    <div id="routing-header">

      <div>

        <div id="routing-title">
          <span>🧭</span>
          <span>Πλοήγηση City4All</span>
        </div>

        <div id="routing-subtitle">
          ArcGIS Location Services
        </div>

      </div>

      <button
        id="close-route"
        class="route-button secondary"
        style="
          width:34px;
          height:34px;
          padding:0;
        "
      >
        ×
      </button>

    </div>


    <div id="route-content">

      <div id="selected-place">

        <strong>
          📍 Προορισμός
        </strong>

        Επίλεξε ένα σημείο City4All.

      </div>


      <div class="route-buttons">

        <button
          id="route-button"
          class="route-button"
          disabled
        >
          🚗 Βρες διαδρομή
        </button>

        <button
          id="location-button"
          class="route-button secondary"
        >
          📍 Η θέση μου
        </button>

      </div>


      <button
        id="google-maps-button"
        class="route-button"
        disabled
      >
        🗺️ Άνοιγμα Google Maps
      </button>


      <div id="route-status">

        Η διαδρομή χρησιμοποιεί
        ArcGIS Location Services.

      </div>


      <div id="route-summary">

        <div class="summary-card">

          <div class="summary-label">
            Απόσταση
          </div>

          <div
            class="summary-value"
            id="distance"
          >
            —
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            Χρόνος
          </div>

          <div
            class="summary-value"
            id="duration"
          >
            —
          </div>

        </div>

      </div>


      <div id="directions"></div>

    </div>

  </div>


  <div id="map-help">
    Κάνε κλικ σε ένα City4All σημείο για να το επιλέξεις.
  </div>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script type="module">

    /*
     * ==================================================
     * CONFIG
     * ==================================================
     */

    const API_URL =
      "https://city4all-ai2-api.ilias-pap-net.workers.dev/";


    const ARCGIS_API_KEY =
      "YOUR_ARCGIS_API_KEY";


    /*
     * ==================================================
     * IMPORT ARCGIS
     * ==================================================
     */

    const [

      esriConfig,

      route,

      RouteParameters,

      FeatureSet,

      Graphic,

      Point,

      GraphicsLayer

    ] = await Promise.all([

      $arcgis.import(
        "@arcgis/core/config.js"
      ),

      $arcgis.import(
        "@arcgis/core/rest/route.js"
      ),

      $arcgis.import(
        "@arcgis/core/rest/support/RouteParameters.js"
      ),

      $arcgis.import(
        "@arcgis/core/rest/support/FeatureSet.js"
      ),

      $arcgis.import(
        "@arcgis/core/Graphic.js"
      ),

      $arcgis.import(
        "@arcgis/core/geometry/Point.js"
      ),

      $arcgis.import(
        "@arcgis/core/layers/GraphicsLayer.js"
      )

    ]);


    if (
      ARCGIS_API_KEY &&
      ARCGIS_API_KEY !==
        "YOUR_ARCGIS_API_KEY"
    ) {

      esriConfig.apiKey =
        ARCGIS_API_KEY;

    }


    /*
     * ==================================================
     * ELEMENTS
     * ==================================================
     */

    const map =
      document.querySelector(
        "#city4all-map"
      );

    const assistant =
      document.querySelector(
        "#city4all-assistant"
      );

    const resultsPanel =
      document.querySelector(
        "#results-panel"
      );

    const resultsList =
      document.querySelector(
        "#results-list"
      );

    const closeResults =
      document.querySelector(
        "#close-results"
      );

    const routingPanel =
      document.querySelector(
        "#routing-panel"
      );

    const routeButton =
      document.querySelector(
        "#route-button"
      );

    const locationButton =
      document.querySelector(
        "#location-button"
      );

    const googleMapsButton =
      document.querySelector(
        "#google-maps-button"
      );

    const closeRoute =
      document.querySelector(
        "#close-route"
      );

    const selectedPlace =
      document.querySelector(
        "#selected-place"
      );

    const routeStatus =
      document.querySelector(
        "#route-status"
      );

    const routeSummary =
      document.querySelector(
        "#route-summary"
      );

    const distanceElement =
      document.querySelector(
        "#distance"
      );

    const durationElement =
      document.querySelector(
        "#duration"
      );

    const directionsElement =
      document.querySelector(
        "#directions"
      );

    const mapHelp =
      document.querySelector(
        "#map-help"
      );


    /*
     * ==================================================
     * STATE
     * ==================================================
     */

    let destinationPoint = null;

    let userLocationPoint = null;

    let destinationGraphic = null;

    let userGraphic = null;

    let routeGraphicsLayer = null;

    let selectedFeature = null;


    /*
     * ==================================================
     * AI PROMPTS
     * ==================================================
     */

    assistant.suggestedPrompts = [

      "Βρες μου προσβάσιμα φαρμακεία στην Ηλιούπολη.",

      "Βρες μου καφετέριες με ράμπα.",

      "Ποια σημεία έχουν είσοδο χωρίς σκαλοπάτια;",

      "Βρες μου προσβάσιμα σημεία στην Καλλιθέα.",

      "Ποια σημεία είναι κατάλληλα για χρήστη αναπηρικού αμαξιδίου;"

    ];


    /*
     * ==================================================
     * MAP READY
     * ==================================================
     */

    map.addEventListener(
      "arcgisViewReadyChange",
      async () => {

        const view =
          map.view;

        if (!view) {
          return;
        }


        routeGraphicsLayer =
          new GraphicsLayer({

            title:
              "City4All Navigation"

          });


        view.map.add(
          routeGraphicsLayer
        );


        setTimeout(
          () => {

            mapHelp.classList.add(
              "visible"
            );

            setTimeout(
              () => {

                mapHelp.classList.remove(
                  "visible"
                );

              },
              4500
            );

          },
          1000
        );

      }
    );


    /*
     * ==================================================
     * MAP CLICK
     * ==================================================
     */

    map.addEventListener(
      "arcgisViewClick",
      async event => {

        try {

          const view =
            map.view;

          if (!view) {
            return;
          }


          const response =
            await view.hitTest(
              event.detail
            );


          if (
            !response ||
            !response.results
          ) {
            return;
          }


          const hit =
            response.results.find(
              result => {

                const graphic =
                  result.graphic;

                return (
                  graphic &&
                  graphic.geometry &&
                  graphic.layer !==
                    routeGraphicsLayer
                );

              }
            );


          if (!hit) {
            return;
          }


          const graphic =
            hit.graphic;


          if (
            graphic.geometry.type !==
              "point"
          ) {
            return;
          }


          selectDestination(
            graphic
          );

        }
        catch (error) {

          console.error(
            "Map click error:",
            error
          );

        }

      }
    );


    /*
     * ==================================================
     * SELECT DESTINATION
     * ==================================================
     */

    async function selectDestination(
      graphic
    ) {

      selectedFeature =
        graphic;

      destinationPoint =
        graphic.geometry;


      routingPanel.style.display =
        "block";


      /*
       * Destination marker
       */

      if (
        destinationGraphic &&
        routeGraphicsLayer
      ) {

        routeGraphicsLayer.remove(
          destinationGraphic
        );

      }


      destinationGraphic =
        new Graphic({

          geometry:
            destinationPoint,

          symbol: {

            type:
              "simple-marker",

            style:
              "diamond",

            size:
              16,

            color:
              "#1769aa",

            outline: {

              color:
                "#ffffff",

              width:
                2

            }

          }

        });


      routeGraphicsLayer.add(
        destinationGraphic
      );


      const attributes =
        graphic.attributes ||
        {};


      const name =
        attributes.field_2 ||
        attributes.name ||
        attributes.Name ||
        "Σημείο City4All";


      const type =
        attributes.field_3 ||
        attributes.type ||
        attributes.Type ||
        "Σημείο προσβασιμότητας";


      const accessibility =
        attributes.field_4 ||
        attributes.accessibility ||
        "";


      selectedPlace.innerHTML = `

        <strong>
          📍 ${escapeHTML(name)}
        </strong>

        <span>
          ${escapeHTML(type)}
        </span>

        ${
          accessibility
            ? `
              <br>
              <span>
                ♿ ${escapeHTML(accessibility)}
              </span>
            `
            : ""
        }

      `;


      routeButton.disabled =
        false;

      googleMapsButton.disabled =
        false;


      routeStatus.textContent =
        "Το σημείο επιλέχθηκε. Μπορείς να ζητήσεις διαδρομή.";


      await map.view.goTo({

        target:
          destinationPoint,

        zoom:
          Math.max(
            map.view.zoom,
            16
          )

      });


      /*
       * Try location silently
       */

      getUserLocation(false);

    }


    /*
     * ==================================================
     * USER LOCATION
     * ==================================================
     */

    function getUserLocation(
      showMessage = true
    ) {

      if (
        !navigator.geolocation
      ) {

        routeStatus.textContent =
          "Ο browser δεν υποστηρίζει εντοπισμό θέσης.";

        return;

      }


      if (showMessage) {

        routeStatus.textContent =
          "📍 Εντοπίζω τη θέση σου...";

      }


      navigator.geolocation.getCurrentPosition(

        position => {

          const {
            latitude,
            longitude
          } =
            position.coords;


          userLocationPoint =
            new Point({

              latitude,

              longitude,

              spatialReference:
                {
                  wkid: 4326
                }

            });


          addUserLocationGraphic();


          if (showMessage) {

            routeStatus.textContent =
              "📍 Η θέση σου εντοπίστηκε.";

          }

        },

        error => {

          console.error(
            "Geolocation:",
            error
          );


          if (showMessage) {

            routeStatus.textContent =
              "Δεν μπόρεσα να εντοπίσω τη θέση σου. Έλεγξε τα permissions του browser.";

          }

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            30000

        }

      );

    }


    /*
     * ==================================================
     * USER LOCATION GRAPHIC
     * ==================================================
     */

    function addUserLocationGraphic() {

      if (
        !routeGraphicsLayer ||
        !userLocationPoint
      ) {
        return;
      }


      if (userGraphic) {

        routeGraphicsLayer.remove(
          userGraphic
        );

      }


      userGraphic =
        new Graphic({

          geometry:
            userLocationPoint,

          symbol: {

            type:
              "simple-marker",

            style:
              "circle",

            size:
              14,

            color:
              "#1769aa",

            outline: {

              color:
                "#ffffff",

              width:
                3

            }

          }

        });


      routeGraphicsLayer.add(
        userGraphic
      );

    }


    /*
     * ==================================================
     * ROUTING
     * ==================================================
     */

    async function calculateRoute() {

      if (
        !destinationPoint
      ) {

        return;

      }


      if (
        !userLocationPoint
      ) {

        routeStatus.textContent =
          "📍 Χρειάζομαι πρώτα την τοποθεσία σου.";

        getUserLocation(true);

        return;

      }


      if (
        !ARCGIS_API_KEY ||
        ARCGIS_API_KEY ===
          "YOUR_ARCGIS_API_KEY"
      ) {

        routeStatus.innerHTML =
          "⚠️ Πρόσθεσε το ArcGIS API Key σου με ενεργοποιημένο Routing.";

        return;

      }


      routeButton.disabled =
        true;


      routeButton.textContent =
        "⏳ Υπολογίζω...";


      routeStatus.textContent =
        "🧭 Υπολογίζω τη διαδρομή...";


      clearRoute();


      try {

        const stops =
          new FeatureSet({

            features: [

              new Graphic({

                geometry:
                  userLocationPoint

              }),

              new Graphic({

                geometry:
                  destinationPoint

              })

            ]

          });


        const params =
          new RouteParameters({

            stops,

            returnRoutes:
              true,

            returnDirections:
              true,

            returnStops:
              true,

            outputSpatialReference:
              4326

          });


        const result =
          await route.solve(

            "https://route-api.arcgis.com/arcgis/rest/services/World/Route/NAServer/Route_World",

            params

          );


        if (
          !result ||
          !result.routeResults ||
          !result.routeResults.length
        ) {

          throw new Error(
            "No route."
          );

        }


        const routeResult =
          result.routeResults[0];


        const routeGraphic =
          routeResult.route;


        /*
         * Route line
         */

        if (
          routeGraphic
        ) {

          routeGraphic.symbol = {

            type:
              "simple-line",

            width:
              5,

            color:
              "#1769aa",

            style:
              "solid"

          };


          routeGraphicsLayer.add(
            routeGraphic
          );

        }


        const attributes =
          routeGraphic.attributes ||
          {};


        const miles =
          Number(
            attributes.Total_Miles ||
            0
          );


        const kilometers =
          miles *
          1.609344;


        const minutes =
          Number(
            attributes.Total_TravelTime ||
            0
          );


        distanceElement.textContent =
          kilometers > 0
            ? formatDistance(
                kilometers
              )
            : "—";


        durationElement.textContent =
          formatDuration(
            minutes
          );


        routeSummary.style.display =
          "grid";


        displayDirections(
          routeResult.directions
        );


        routeStatus.textContent =
          "✅ Η διαδρομή υπολογίστηκε με ArcGIS Location Services.";


        if (
          routeGraphic.geometry
        ) {

          await map.view.goTo(

            routeGraphic
              .geometry
              .extent
              .expand(1.25)

          );

        }

      }
      catch (error) {

        console.error(
          "Routing error:",
          error
        );


        routeStatus.innerHTML =
          `
            ⚠️ Δεν μπόρεσα να υπολογίσω τη διαδρομή.
            <br><br>
            Έλεγξε ότι το ArcGIS API Key έχει
            <strong>Location services → Routing</strong>.
          `;

      }
      finally {

        routeButton.disabled =
          false;

        routeButton.textContent =
          "🚗 Βρες διαδρομή";

      }

    }


    /*
     * ==================================================
     * GOOGLE MAPS
     * ==================================================
     */

    googleMapsButton.addEventListener(
      "click",
      () => {

        if (
          !destinationPoint
        ) {
          return;
        }


        const latitude =
          destinationPoint.latitude;


        const longitude =
          destinationPoint.longitude;


        if (
          !Number.isFinite(
            latitude
          ) ||
          !Number.isFinite(
            longitude
          )
        ) {
          return;
        }


        const destination =
          `${latitude},${longitude}`;


        const url =
          `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&travelmode=driving`;


        window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );

      }
    );


    /*
     * ==================================================
     * DIRECTIONS
     * ==================================================
     */

    function displayDirections(
      directions
    ) {

      if (
        !directions
      ) {

        directionsElement.style.display =
          "none";

        return;

      }


      const features =
        directions.features ||
        [];


      if (
        !features.length
      ) {

        directionsElement.style.display =
          "none";

        return;

      }


      directionsElement.innerHTML =
        "";


      features.forEach(
        (step, index) => {

          const attributes =
            step.attributes ||
            {};


          const text =
            attributes.text ||
            attributes.Text ||
            attributes.instruction ||
            "";


          const length =
            attributes.length ??
            attributes.Length ??
            null;


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "direction-step";


          item.innerHTML = `

            <strong>
              ${index + 1}.
            </strong>

            ${escapeHTML(text)}

            ${
              length !== null
                ? `
                  <br>
                  <span style="color:#667085">
                    ${formatDirectionDistance(length)}
                  </span>
                `
                : ""
            }

          `;


          directionsElement.appendChild(
            item
          );

        }
      );


      directionsElement.style.display =
        "block";

    }


    /*
     * ==================================================
     * CLEAR ROUTE
     * ==================================================
     */

    function clearRoute() {

      if (
        !routeGraphicsLayer
      ) {
        return;
      }


      const graphics =
        routeGraphicsLayer.graphics
          .toArray();


      graphics.forEach(
        graphic => {

          if (
            graphic !==
              destinationGraphic &&
            graphic !==
              userGraphic
          ) {

            routeGraphicsLayer.remove(
              graphic
            );

          }

        }
      );


      routeSummary.style.display =
        "none";


      directionsElement.style.display =
        "none";


      directionsElement.innerHTML =
        "";

    }


    /*
     * ==================================================
     * CLOSE ROUTING
     * ==================================================
     */

    closeRoute.addEventListener(
      "click",
      () => {

        routingPanel.style.display =
          "none";


        clearRoute();


        destinationPoint =
          null;


        selectedFeature =
          null;


        routeButton.disabled =
          true;


        googleMapsButton.disabled =
          true;


        selectedPlace.innerHTML = `

          <strong>
            📍 Προορισμός
          </strong>

          Επίλεξε ένα σημείο City4All.

        `;

      }
    );


    /*
     * ==================================================
     * CLOSE RESULTS
     * ==================================================
     */

    closeResults.addEventListener(
      "click",
      () => {

        resultsPanel.style.display =
          "none";

      }
    );


    /*
     * ==================================================
     * BUTTONS
     * ==================================================
     */

    routeButton.addEventListener(
      "click",
      calculateRoute
    );


    locationButton.addEventListener(
      "click",
      () => {

        getUserLocation(true);

      }
    );


    /*
     * ==================================================
     * FORMATTERS
     * ==================================================
     */

    function formatDistance(
      kilometers
    ) {

      if (
        kilometers < 1
      ) {

        return (
          Math.round(
            kilometers * 1000
          ) +
          " m"
        );

      }


      return (
        kilometers.toFixed(1) +
        " km"
      );

    }


    function formatDuration(
      minutes
    ) {

      if (
        !minutes ||
        minutes <= 0
      ) {

        return "—";

      }


      const rounded =
        Math.round(
          minutes
        );


      const hours =
        Math.floor(
          rounded / 60
        );


      const mins =
        rounded % 60;


      if (
        hours > 0
      ) {

        return (
          hours +
          " ώρ. " +
          mins +
          " λ."
        );

      }


      return (
        mins +
        " λεπτά"
      );

    }


    function formatDirectionDistance(
      value
    ) {

      const number =
        Number(value);


      if (
        !Number.isFinite(
          number
        )
      ) {

        return "";

      }


      if (
        number < 1
      ) {

        return (
          Math.round(
            number * 1000
          ) +
          " m"
        );

      }


      return (
        number.toFixed(1) +
        " km"
      );

    }


    function escapeHTML(
      value
    ) {

      return String(
        value || ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /*
     * ==================================================
     * INITIALIZE
     * ==================================================
     */

    getUserLocation(false);

    console.log(
      "City4All AI frontend initialized."
    );

  </script>

</body>
</html>
